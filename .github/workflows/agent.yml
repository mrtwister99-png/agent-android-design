name: Loyo Design Tokenizer
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout main app
        uses: actions/checkout@v4
        with:
          repository: mrtwister99-png/android-app-main
          token: ${{ secrets.GH_TOKEN || secrets.GH_PAT }}
          path: main
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          repository: mrtwister99-png/agent-android-design
          token: ${{ secrets.GH_TOKEN || secrets.GH_PAT }}
          path: agent
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install google-genai PyGithub
      - name: Run agent
        run: python agent/agent.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: mrtwister99-png/android-app-main
          AGENT_LABEL: android-design

